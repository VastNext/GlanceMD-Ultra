[package]
name = "glancemd"
version = "1.6.3"
edition = "2021"

# 产物名与仓库名保持一致：GlanceMD.exe
[[bin]]
name = "GlanceMD"
path = "src/main.rs"

[dependencies]
wry = "0.49"
tao = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
percent-encoding = "2"
png = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.35"
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"

[package.metadata.packager]
product-name = "GlanceMD"
identifier = "com.vastnext.glancemd"
description = "轻量级跨平台 Markdown 查看器与编辑器"
homepage = "https://github.com/VastNext/GlanceMD"
authors = ["VastNext"]
category = "Utility"
license-file = "LICENSE"
icons = ["assets/icon.png"]

[[package.metadata.packager.file-associations]]
extensions = ["md", "markdown"]
mime-type = "text/markdown"
name = "Markdown Document"
role = "editor"

[[package.metadata.packager.file-associations]]
extensions = ["txt"]
mime-type = "text/plain"
name = "Text Document"
role = "editor"

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.macos]
minimum-system-version = "10.13"

[package.metadata.packager.deb]
depends = ["libgtk-3-0", "libwebkit2gtk-4.1-0"]

[package.metadata.packager.appimage]
libs = [
  "WebKitNetworkProcess",
  "WebKitWebProcess",
  "libwebkit2gtkinjectedbundle.so",
]

[package.metadata.packager.appimage.linuxdeploy-plugins]
gtk = "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
