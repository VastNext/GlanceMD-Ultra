<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>/* __CSS__ */</style>
</head>
<body>
  <div id="titlebar">
    <div class="titlebar-actions">
      <button id="btn-new" title="New" data-i18n-title="toolbar.new" data-command-id="file.new">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5.5L13 5v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.2"/><path d="M9 1.5V5h3.5" stroke="currentColor" stroke-width="1.2"/><path d="M6 9h4M8 7v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-open" title="Open Folder" data-i18n-title="toolbar.openFolder" data-command-id="workspace.open">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 13V4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-open-file" title="Open File" aria-label="Open File" data-i18n-title="toolbar.openFile" data-i18n-aria="toolbar.openFileAria" data-command-id="file.open">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3 1.5h7l3 3v10H3z" stroke="currentColor" stroke-width="1.2"/><path d="M10 1.5V5h3M5.5 8h5M5.5 10.5h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-settings" title="Settings" aria-label="Settings" data-i18n-title="toolbar.settings" data-i18n-aria="toolbar.settings" data-command-id="settings.toggle">
        <svg viewBox="0 0 16 16" fill="none"><path d="M6.7 1.8h2.6l.4 1.7c.4.1.8.3 1.2.5l1.5-.9 1.8 1.8-.9 1.5c.2.4.4.8.5 1.2l1.7.4v2.6l-1.7.4c-.1.4-.3.8-.5 1.2l.9 1.5-1.8 1.8-1.5-.9c-.4.2-.8.4-1.2.5l-.4 1.7H6.7l-.4-1.7c-.4-.1-.8-.3-1.2-.5l-1.5.9-1.8-1.8.9-1.5c-.2-.4-.4-.8-.5-1.2L.5 10.6V8l1.7-.4c.1-.4.3-.8.5-1.2l-.9-1.5 1.8-1.8 1.5.9c.4-.2.8-.4 1.2-.5z" transform="translate(.5 -.5)" stroke="currentColor" stroke-width="1.1"/><circle cx="8" cy="9.3" r="2" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button id="btn-save" title="Save" data-i18n-title="toolbar.save" data-command-id="file.save">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3 1.5h8.5L14 4v9.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.2"/><rect x="5" y="1.5" width="5" height="4" rx="0.5" stroke="currentColor" stroke-width="1.2"/><rect x="4.5" y="9" width="7" height="4.5" rx="0.5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div class="titlebar-sep"></div>
      <button id="btn-toggle" title="Toggle Preview" data-i18n-title="toolbar.togglePreview" data-command-id="editor.togglePreview">
        <div id="mode-segmented" class="mode-segmented" role="group" aria-label="Editor Mode">
          <span id="btn-mode-edit" class="mode-seg-btn active" title="编辑模式 (Ctrl+Shift+V)" aria-label="Edit Mode" data-mode="edit" data-i18n-title="toolbar.modeEdit" data-i18n-aria="toolbar.modeEdit">
            <svg viewBox="0 0 16 16" fill="none"><path d="M11.5 1.5l3 3L5 14H2v-3L11.5 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9.5 3.5l3 3" stroke="currentColor" stroke-width="1.2"/></svg>
          </span>
          <span id="btn-mode-preview" class="mode-seg-btn" title="预览模式 (Ctrl+Shift+V)" aria-label="Preview Mode" data-mode="preview" data-i18n-title="toolbar.modePreview" data-i18n-aria="toolbar.modePreview">
            <svg viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/></svg>
          </span>
        </div>
        <svg id="icon-preview" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/></svg>
        <svg id="icon-edit" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M11.5 1.5l3 3L5 14H2v-3L11.5 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9.5 3.5l3 3" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-split" title="Split View" data-i18n-title="toolbar.splitView" data-command-id="editor.toggleSplit">
        <svg viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" stroke="currentColor" stroke-width="1.2"/><line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-word-wrap" class="titlebar-btn active" title="自动换行：已开启 (Alt+Shift+Y)" aria-label="Toggle Word Wrap" data-i18n-title="toolbar.wordWrapOn" data-command-id="editor.toggleWrap">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 3.5h12M2 7.5h8.5a2.5 2.5 0 0 1 0 5H8.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M10.5 10.5l-2 2 2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-toc" title="Outline" data-i18n-title="toolbar.outline" data-command-id="outline.toggle">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3 3h10M3 6.5h7M3 10h8M3 13.5h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <span id="titlebar-title">GlanceMD Ultra</span>
    <div id="window-controls">
      <button id="btn-theme" title="Toggle Theme" data-i18n-title="toolbar.toggleTheme">
        <svg id="icon-sun" viewBox="0 0 16 16" fill="none" style="display:none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2"/><path d="M8 2v1.5M8 12.5V14M2 8h1.5M12.5 8H14M3.75 3.75l1.06 1.06M11.19 11.19l1.06 1.06M3.75 12.25l1.06-1.06M11.19 4.81l1.06-1.06" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <svg id="icon-moon" viewBox="0 0 16 16" fill="none"><path d="M13.5 8.5a5.5 5.5 0 0 1-6-6 5.5 5.5 0 1 0 6 6z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
      <div class="window-controls-sep"></div>
      <button id="btn-minimize" title="Minimize" data-i18n-title="toolbar.minimize">
        <svg viewBox="0 0 10 10"><line x1="2" y1="5" x2="8" y2="5"/></svg>
      </button>
      <button id="btn-maximize" title="Maximize" data-i18n-title="toolbar.maximize">
        <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1"/></svg>
      </button>
      <button id="btn-close" title="Close" data-i18n-title="toolbar.close">
        <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
      </button>
    </div>
  </div>

  <div id="tab-bar-wrap">
    <button id="tab-nav-left" class="tab-nav" title="Scroll tabs left" aria-label="Scroll tabs left" data-i18n-title="toolbar.scrollTabsLeft" data-i18n-aria="toolbar.scrollTabsLeft">
      <svg viewBox="0 0 10 10"><polyline points="6,2 3,5 6,8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="tab-bar"></div>
    <button id="tab-nav-right" class="tab-nav" title="Scroll tabs right" aria-label="Scroll tabs right" data-i18n-title="toolbar.scrollTabsRight" data-i18n-aria="toolbar.scrollTabsRight">
      <svg viewBox="0 0 10 10"><polyline points="4,2 7,5 4,8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="content">
    <!-- 工作区三栏骨架（阶段 1，对照 docs/design/01-project-tree.html）：
         左侧项目树面板 | 拖宽手柄 | 中央编辑列（既有 DOM 原样内移） | 拖宽手柄 | Outline 面板。
         面板折叠/拖宽/持久化由 layout.js（window.LayoutUI）负责；
         #project-tree-root 由阶段 1 的 project-tree.js 挂载树内容。 -->
    <aside id="panel-tree" class="workspace-panel" data-panel="tree" aria-label="项目树">
      <div class="panel-head">
        <span class="panel-title">资源管理器</span>
        <button id="panel-tree-collapse" class="panel-btn" type="button" title="折叠面板" aria-label="折叠面板">
          <svg viewBox="0 0 16 16" fill="none"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="panel-body" id="project-tree-root">
        <p class="panel-empty">尚未打开项目</p>
      </div>
      <button id="panel-tree-expand" class="panel-expand-btn" type="button" title="展开面板" aria-label="展开项目树面板">资源管理器</button>
    </aside>

    <div class="panel-resizer" id="panel-tree-resizer" title="拖动调整宽度" aria-label="调整项目树面板宽度"></div>

    <div id="editor-column">
      <section id="navigation-fallback" role="alert" aria-live="assertive" tabindex="-1" hidden>
        <div class="navigation-fallback-copy">
          <strong>无法打开链接</strong>
          <span id="navigation-fallback-target"></span>
        </div>
        <div class="navigation-fallback-actions">
          <button id="navigation-fallback-back" type="button">返回文档</button>
          <button id="navigation-fallback-retry" type="button">重试</button>
          <button id="navigation-fallback-close" class="navigation-fallback-close" type="button" aria-label="关闭提示">&times;</button>
        </div>
      </section>
        <div id="welcome-view" class="welcome-view" style="display:none;">
          <div class="welcome-container">
            <div class="welcome-header">
              <h1 class="welcome-title">GlanceMD Ultra</h1>
              <p class="welcome-subtitle" data-i18n="welcome.subtitle">轻量原生 Markdown 工作区编辑器</p>
            </div>
            <div class="welcome-shortcuts">
              <button id="welcome-btn-new" class="welcome-btn" type="button" data-command-id="file.new">
                <svg viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5.5L13 5v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.2"/><path d="M9 1.5V5h3.5" stroke="currentColor" stroke-width="1.2"/><path d="M6 9h4M8 7v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                <div class="welcome-btn-text">
                  <span class="welcome-btn-primary" data-i18n="welcome.newFile">新建文件</span>
                  <span class="welcome-btn-shortcut">Ctrl+N</span>
                </div>
              </button>
              <button id="welcome-btn-open-file" class="welcome-btn" type="button" data-command-id="file.open">
                <svg viewBox="0 0 16 16" fill="none"><path d="M3 1.5h7l3 3v10H3z" stroke="currentColor" stroke-width="1.2"/><path d="M10 1.5V5h3M5.5 8h5M5.5 10.5h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                <div class="welcome-btn-text">
                  <span class="welcome-btn-primary" data-i18n="welcome.openFile">打开文件</span>
                  <span class="welcome-btn-shortcut"></span>
                </div>
              </button>
              <button id="welcome-btn-open-folder" class="welcome-btn" type="button" data-command-id="workspace.open">
                <svg viewBox="0 0 16 16" fill="none"><path d="M2 13V4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.2"/></svg>
                <div class="welcome-btn-text">
                  <span class="welcome-btn-primary" data-i18n="welcome.openFolder">打开文件夹</span>
                  <span class="welcome-btn-shortcut"></span>
                </div>
              </button>
            </div>
            <div class="welcome-recent-section">
              <div class="welcome-recent-header">
                <div class="welcome-tabs" role="tablist" aria-label="最近记录">
                  <button type="button" class="welcome-tab active" id="welcome-tab-projects" role="tab" aria-selected="true" data-tab="projects" data-i18n="welcome.recentProjects">最近目录</button>
                  <button type="button" class="welcome-tab" id="welcome-tab-files" role="tab" aria-selected="false" data-tab="files" data-i18n="welcome.recentFiles">最近文件</button>
                </div>
              </div>
              <div id="welcome-projects-pane" class="welcome-tab-pane active" role="tabpanel" aria-labelledby="welcome-tab-projects">
                <div id="welcome-recent-projects-list" class="welcome-recent-list"></div>
                <div id="welcome-recent-projects-empty" class="welcome-recent-empty" data-i18n="welcome.noRecentProjects" style="display:none;">尚未打开过项目，点击上方打开文件夹开始</div>
              </div>
              <div id="welcome-files-pane" class="welcome-tab-pane" role="tabpanel" aria-labelledby="welcome-tab-files" style="display:none;">
                <div id="welcome-recent-list" class="welcome-recent-list"></div>
                <div id="welcome-recent-empty" class="welcome-recent-empty" data-i18n="welcome.noRecent" style="display:none;">暂无最近文件</div>
              </div>
            </div>
          </div>
        </div>
      <div id="editor-container" class="active">
        <div id="find-bar">
          <input id="find-input" type="text" placeholder="Find..." spellcheck="false" data-i18n-placeholder="app.find">
          <span id="find-count"></span>
          <button id="find-prev" title="Previous (Shift+Enter)" data-i18n-title="toolbar.prev">
            <svg viewBox="0 0 10 10"><polyline points="2,7 5,3 8,7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="find-next" title="Next (Enter)" data-i18n-title="toolbar.next">
            <svg viewBox="0 0 10 10"><polyline points="2,3 5,7 8,3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="find-close" title="Close (Escape)" data-i18n-title="toolbar.closeFind">
            <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>
          </button>
        </div>
        <div id="goto-bar">
          <input id="goto-input" type="text" inputmode="numeric" placeholder="Go to line…" spellcheck="false">
          <span id="goto-hint" aria-live="polite"></span>
          <button id="goto-btn-go" type="button" title="Go">Go</button>
          <button id="goto-close" type="button" title="Close (Escape)" aria-label="Close">&times;</button>
        </div>
        <div id="recent-panel"></div>
        <!-- 行号槽：绝对定位覆盖 #editor 左侧 padding 区，显隐/内容由
             settings-apply.js（window.SettingsApply）按 editor.lineNumbers 驱动 -->
        <div id="editor-gutter" aria-hidden="true"></div>
        <textarea id="editor" placeholder="Start writing markdown..." spellcheck="false"></textarea>
        <div id="split-resize-handle" title="Drag to resize panes" aria-label="Drag to resize panes"></div>
      </div>

      <div id="preview-container">
        <div id="preview-wrapper" tabindex="0">
          <div id="preview"></div>
        </div>
      </div>

      <div id="image-container">
        <div id="image-viewer">
          <div id="image-stage">
            <img id="image-preview" alt="Image preview" draggable="false">
          </div>
          <div id="image-toolbar">
            <button id="btn-img-zoom-out" title="Zoom Out (-)">
              <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.2"/><line x1="4.5" y1="7" x2="9.5" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="10.5" y1="10.5" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </button>
            <span id="image-zoom-val">100%</span>
            <button id="btn-img-zoom-in" title="Zoom In (+)">
              <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.2"/><line x1="4.5" y1="7" x2="9.5" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="7" y1="4.5" x2="7" y2="9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="10.5" y1="10.5" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-img-zoom-reset" title="Fit to Window (0)">Fit</button>
            <button id="btn-img-zoom-actual" title="Actual Size (1)">1:1</button>
            <div class="image-meta-pill" id="image-meta-info"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel-resizer" id="panel-outline-resizer" title="拖动调整宽度" aria-label="调整 Outline 面板宽度"></div>

    <aside id="panel-outline" class="workspace-panel" data-panel="outline" aria-label="大纲">
      <div class="panel-head">
        <span class="panel-title">Outline</span>
        <button id="panel-outline-collapse" class="panel-btn" type="button" title="折叠面板" aria-label="折叠面板">
          <svg viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="panel-body" id="outline-root">
        <p class="panel-empty">暂无大纲</p>
      </div>
      <button id="panel-outline-expand" class="panel-expand-btn" type="button" title="展开面板" aria-label="展开 Outline 面板">Outline</button>
    </aside>
  </div>

  <div id="image-lightbox" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <img id="lightbox-img" alt="Lightbox Image">
      <div class="lightbox-caption" id="lightbox-caption"></div>
      <button class="lightbox-close" id="lightbox-close" aria-label="Close preview">&times;</button>
    </div>
  </div>

  <div id="zoom-toast"></div>

  <div id="drop-overlay">
    <div class="drop-message">Drop to open</div>
  </div>

  <div id="statusbar">
    <span id="status-mode">EDIT</span>
    <span id="status-file"></span>
    <span id="status-counts"></span>
    <span id="status-info"></span>
  </div>

  <!-- __SCRIPTS__ -->
</body>
</html>
