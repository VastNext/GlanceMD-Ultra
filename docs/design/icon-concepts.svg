<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="620" viewBox="0 0 1536 620" role="img" aria-labelledby="title desc">
  <title id="title">GlanceMD Ultra 三套图标概念</title>
  <desc id="desc">G 形视口、工作区树形和折叠页面加 U 形负形三套图标概念。</desc>
  <defs>
